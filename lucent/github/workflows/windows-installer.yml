name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --ignore-workspace --no-frozen-lockfile

      - name: Generate app icons
        run: pnpm tauri icon app-icon.svg

      - name: Build installers
        run: pnpm tauri build

      - name: Collect files
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/out"
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe $out
          Copy-Item src-tauri/target/release/bundle/msi/*.msi $out
          Copy-Item src-tauri/target/release/lucent.exe "$out/Lucent-portable.exe"
          Get-ChildItem $out

      - uses: actions/upload-artifact@v4
        with:
          name: Lucent-Windows
          path: out/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
