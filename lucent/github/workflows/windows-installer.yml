name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: lucent/desktop

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --ignore-workspace --no-frozen-lockfile

      - name: Generate icons
        run: pnpm app:icons

      - name: Build installer
        run: pnpm tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Lucent-Windows-Installer
          path: lucent/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
